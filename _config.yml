# _config.yml

remote_theme: pages-themes/cayman@v0.2.0
plugins:
- jekyll-remote-theme
- jekyll-archives
- jekyll-paginate
- jekyll-toc

title: Anastasia's Blog
description: >-
  Anastasia's Blog | <a href="https://www.linkedin.com/in/shutong-liu" target="_blank" rel="noopener noreferrer">LinkedIn</a>
baseurl: "/"
permalink: :title/
layout: default
paginate: 10

nav:
  - title: Home
    url: /
  - title: Posts
    url: /posts
  - title: ☆
    url: /show-tag
  - title: To-Do
    url: /To-Do

jekyll-archives:
  enabled: [tags]
  layout: tag
  permalink: "/tag/:tag/"


linkedin: "https://www.linkedin.com/in/shutong-liu/"